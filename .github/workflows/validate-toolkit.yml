name: Validate toolkit

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Deploy creates ~/.cursor/{skills,rules,hooks,sdd} so deploy validators
      # can check the same paths as a local sync.
      - name: Sync toolkit to Cursor paths
        shell: pwsh
        run: |
          ./scripts/sync-cursor.ps1
        working-directory: ${{ github.workspace }}

      - name: Run validate-all (smoke + contracts/graph/fixtures)
        shell: pwsh
        run: |
          ./scripts/validation/validate-all.ps1 -Quiet
        working-directory: ${{ github.workspace }}
